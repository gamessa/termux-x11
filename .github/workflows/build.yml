name: Build Lorie AAR

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build AAR
      run: ./gradlew :lorie:assembleRelease

    - name: Upload AAR
      uses: actions/upload-artifact@v4
      with:
        name: lorie-release-aar
        path: lorie/build/outputs/aar/lorie-release.aar
